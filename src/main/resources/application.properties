#############################################################
# TSATMS - Telecom Service Assurance & Trouble Ticket
#          Management System
# Application configuration
#############################################################

# ---------- Application ----------
app.name=Telecom Service Assurance System
app.version=1.0.0
app.environment=DEV

# ---------- Database: server ----------
# Server-level URL (no schema). Used for connectivity diagnostics and
# for the Phase 2 schema bootstrap.
db.host=localhost
db.port=3306
db.schema=tsatms_db
db.driver=com.mysql.cj.jdbc.Driver
db.params=useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&useUnicode=true&characterEncoding=UTF-8

# ---------- Database: administrator account ----------
# Only used once, by the Phase 2 schema bootstrap, to create the schema
# and the dedicated application user below.
# >>> SET THIS to the MySQL root password you chose during installation. <<<
db.admin.username=root
db.admin.password=

# ---------- Database: application account ----------
# The account the application itself runs as, created by --setup-db.
# >>> SET THIS to the password you want that account to have. <<<
db.username=tsatms_user
db.password=

# ---------- Connection behaviour ----------
db.connection.timeout.seconds=10
db.validation.timeout.seconds=5
db.autocommit=true

# ---------- Logging ----------
# log.level controls the log file. The console is deliberately quieter so that
# log lines never interleave with the interactive menus.
log.level=INFO
log.directory=logs
log.file=tsatms.log
log.file.enabled=true
log.file.size.bytes=5242880
log.file.count=5
log.console.enabled=true
log.console.level=WARNING

# ---------- Security ----------
# The password given to every seeded demo account by --provision-users.
# It must satisfy the password policy: at least 8 characters with an upper
# case letter, a lower case letter, a digit and a symbol.
# Change it here before provisioning if you want a different one; the
# application never prints this value back to the screen.
# >>> SET THIS before running --provision-users. <<<
security.demo.password=

# ---------- SLA ----------
# The response and resolution windows themselves live in the
# sla_configuration table, so a network manager can retune them from the
# application. What is configured here is which minutes count towards them.
#
#   continuous     - every minute, day and night, weekday and weekend
#   business-hours - only the working hours set below
#
# sla.clock.default applies to any band without an entry of its own.
# Leave everything on continuous unless you have a reason not to: it is
# what a network operations centre actually promises, and it is what the
# database's fn_sla_status computes, so Java and SQL then agree exactly.
sla.clock.default=continuous
#sla.clock.low=business-hours
#sla.clock.medium=continuous
#sla.clock.high=continuous
#sla.clock.critical=continuous

# Used only by the business-hours clock. Days accept MON or MONDAY.
sla.business-hours.opens=09:00
sla.business-hours.closes=18:00
sla.business-hours.days=MON,TUE,WED,THU,FRI

# ---------- Reports ----------
report.output.directory=reports
report.csv.delimiter=,
